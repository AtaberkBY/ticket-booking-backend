apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: "/mnt/data/postgres"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: nestjs-ticket-secret
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nestjs-ticket-secret
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: nestjs-ticket-config
                  key: DB_NAME
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nestjs-ticket-config
data:
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "ticket_booking"
  JWT_EXPIRATION: "1d"
---
apiVersion: v1
kind: Secret
metadata:
  name: nestjs-ticket-secret
type: Opaque
stringData:
  DB_USER: "ticket_user"
  DB_PASSWORD: "***REMOVED***"
  JWT_SECRET_KEY: "***REMOVED***"
  ADMIN_EMAIL: "ataberk@fenasalbiletler.com"
  ADMIN_PASSWORD: "***REMOVED***"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nestjs-ticket-deployment
  labels:
    app: nestjs-ticket-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nestjs-ticket-api
  template:
    metadata:
      labels:
        app: nestjs-ticket-api
    spec:
      containers:
        - name: nestjs-ticket-api
          image: ataberkby/ticket-booking-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: nestjs-ticket-config
            - secretRef:
                name: nestjs-ticket-secret
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /tickets
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /tickets
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: nestjs-ticket-service
spec:
  type: NodePort
  selector:
    app: nestjs-ticket-api
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30080